<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OpenDID Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.7; } }
  @keyframes scanLine {
    0% { top: 24px; }
    50% { top: calc(100% - 28px); }
    100% { top: 24px; }
  }
  @keyframes expand {
    from { opacity: 0; max-height: 0; }
    to { opacity: 1; max-height: 1000px; }
  }
  @keyframes bioSlide {
    0%, 40%   { transform: translateX(0); }
    50%, 90%  { transform: translateX(-33.3333%); }
    100%      { transform: translateX(-66.6666%); }
  }
  @keyframes successHaloIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes successPop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes successCheckIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">



const Icon = ({ d, size = 24, color = 'currentColor', stroke = 1.8, fill = 'none', children }) =>
<svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color}
strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
    {d ? <path d={d} /> : children}
  </svg>;


const IcMenu = (p) => <Icon {...p}><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></Icon>;
const IcAdd = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const IcBack = (p) => <Icon {...p}><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></Icon>;
const IcClose = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const IcChevR = (p) => <Icon {...p}><polyline points="9 6 15 12 9 18" /></Icon>;
const IcChevD = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9" /></Icon>;
const IcChevU = (p) => <Icon {...p}><polyline points="6 15 12 9 18 15" /></Icon>;
const IcCheck = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const IcEye = (p) => <Icon {...p}><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" /><circle cx="12" cy="12" r="3" /></Icon>;
const IcEyeOff = (p) => <Icon {...p}><path d="M17.94 17.94A10.1 10.1 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.6 9.6 0 0 1 12 4c7 0 11 7 11 7a18.4 18.4 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" /></Icon>;
const IcDelete = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6M14 11v6" /><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" /></Icon>;
const IcUser = (p) => <Icon {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></Icon>;
const IcLock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></Icon>;
const IcSign = (p) => <Icon {...p}><path d="M3 21h18" /><path d="M5 17l9-9 4 4-9 9H5v-4z" /><path d="M14 6l3-3 3 3-3 3" /></Icon>;
const IcNfc = (p) => <Icon {...p}><path d="M5 12a7 7 0 0 1 7-7" /><path d="M5 8a11 11 0 0 1 11-11" transform="translate(0 12)" /><path d="M9 12a3 3 0 0 1 3-3 3 3 0 0 1 3 3 3 3 0 0 1-3 3" /><circle cx="12" cy="12" r="1.2" fill="currentColor" /></Icon>;
const IcProximity = (p) => <Icon {...p}><circle cx="6" cy="8" r="2.2" /><path d="M2.5 19v-0.5c0-1.9 1.6-3.5 3.5-3.5s3.5 1.6 3.5 3.5V19" /><circle cx="18" cy="8" r="2.2" /><path d="M14.5 19v-0.5c0-1.9 1.6-3.5 3.5-3.5s3.5 1.6 3.5 3.5V19" /><line x1="10.5" y1="10.5" x2="13.5" y2="10.5" /><line x1="10.5" y1="13" x2="13.5" y2="13" /></Icon>;
const IcQR = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><path d="M14 14h3v3h-3zM20 14v3M14 20h3M17 17h4v4" /></Icon>;
const IcList = (p) => <Icon {...p}><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><circle cx="4" cy="6" r="1" fill="currentColor" /><circle cx="4" cy="12" r="1" fill="currentColor" /><circle cx="4" cy="18" r="1" fill="currentColor" /></Icon>;
const IcShield = (p) => <Icon {...p}><path d="M12 2L4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z" /></Icon>;
const IcRefresh = (p) => <Icon {...p}><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></Icon>;
const IcFinger = (p) => <Icon {...p}><path d="M7.86 4.24A7.5 7.5 0 0 1 19.5 10.5c0 2.92-.56 5.71-1.57 8.27" /><path d="M5.74 6.36A7.47 7.47 0 0 0 4.5 10.5a7.46 7.46 0 0 1-1.15 3.99" /><path d="M4.34 18.05A11.21 11.21 0 0 0 8.25 10.5a3.75 3.75 0 1 1 7.5 0c0 .53-.02 1.05-.06 1.57" /><path d="M12 10.5a14.94 14.94 0 0 1-3.6 9.75" /><path d="M15.63 15.65a18.67 18.67 0 0 1-2.48 5.33" /></Icon>;
const IcFace = (p) => <Icon {...p}><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><circle cx="9" cy="10" r="1" /><circle cx="15" cy="10" r="1" /><path d="M9 15c.8 .8 1.8 1.2 3 1.2s2.2 -.4 3 -1.2" /></Icon>;
const IcID = (p) => <Icon {...p}><rect x="2" y="5" width="20" height="14" rx="2" /><circle cx="9" cy="12" r="2.5" /><path d="M14 10h5M14 14h3" /></Icon>;
const IcBuilding = (p) => <Icon {...p}><rect x="4" y="3" width="16" height="18" rx="1" /><path d="M9 21V12h6v9M8 7h2M14 7h2M8 11h2M14 11h2" /></Icon>;
const IcKeypad = (p) => <Icon {...p}><circle cx="6" cy="6" r="1.4" fill="currentColor" /><circle cx="12" cy="6" r="1.4" fill="currentColor" /><circle cx="18" cy="6" r="1.4" fill="currentColor" /><circle cx="6" cy="12" r="1.4" fill="currentColor" /><circle cx="12" cy="12" r="1.4" fill="currentColor" /><circle cx="18" cy="12" r="1.4" fill="currentColor" /><circle cx="6" cy="18" r="1.4" fill="currentColor" /><circle cx="12" cy="18" r="1.4" fill="currentColor" /><circle cx="18" cy="18" r="1.4" fill="currentColor" /></Icon>;
const IcCopy = (p) => <Icon {...p}><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></Icon>;

Object.assign(window, { Icon, IcMenu, IcAdd, IcBack, IcClose, IcChevR, IcChevD, IcChevU, IcCheck, IcEye, IcEyeOff, IcDelete, IcUser, IcLock, IcSign, IcNfc, IcProximity, IcQR, IcList, IcShield, IcRefresh, IcFinger, IcFace, IcID, IcBuilding, IcKeypad, IcCopy });

const C = {
  primary: '#EF8B34',
  primaryLight: '#F6AC6E',
  primaryDark: '#C56C1F',
  primaryPale: '#FDF1E5',
  bg: '#FAFAFA',
  surface: '#FAFAFA',
  textPri: '#000000',
  textSec: '#676666',
  divider: '#EEEEEE',
  success: '#3F8B5A',
  warning: '#C18430',
  error: '#B83C3C',
  blue50: '#E8EDF6',
  blue700: '#3F5C8D',
  gray100: '#F5F5F5',
  gray200: '#EEEEEE',
  gray300: '#E0E0E0',
  gray500: '#9E9E9E',
  gray700: '#676666'
};

const FONT = `'Pretendard', 'Pretendard Variable', system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif`;

function PrimaryBtn({ children, onClick, disabled, style }) {
  const [pressed, setPressed] = React.useState(false);
  const release = () => setPressed(false);
  const press = () => {if (!disabled) setPressed(true);};
  return (
    <button
      onClick={disabled ? undefined : onClick}
      onMouseDown={press}
      onMouseUp={release}
      onMouseLeave={release}
      onTouchStart={press}
      onTouchEnd={release}
      onTouchCancel={release}
      disabled={disabled}
      style={{
        width: '100%', height: 52, borderRadius: 12, border: 'none',
        background: disabled ? '#F8D7B8' : pressed ? C.primaryDark : C.primary,
        color: '#fff', fontSize: 16, fontWeight: 600, fontFamily: FONT,
        cursor: disabled ? 'default' : 'pointer', letterSpacing: 0.3,
        boxShadow: disabled ? 'none' : pressed ?
        'inset 0 2px 6px rgba(0,0,0,0.18)' :
        '0 2px 6px rgba(239, 139, 52, 0.30)',
        transition: 'background 120ms ease, box-shadow 120ms ease',
        ...style
      }}>{children}</button>);

}

function OutlineBtn({ children, onClick, color = C.primary, disabled, style }) {
  const [pressed, setPressed] = React.useState(false);
  const release = () => setPressed(false);
  const press = () => {if (!disabled) setPressed(true);};
  return (
    <button
      onClick={disabled ? undefined : onClick}
      onMouseDown={press}
      onMouseUp={release}
      onMouseLeave={release}
      onTouchStart={press}
      onTouchEnd={release}
      onTouchCancel={release}
      disabled={disabled}
      style={{
        width: '100%', height: 52, borderRadius: 12,
        border: `1.5px solid ${disabled ? C.gray300 : color}`,
        background: !disabled && pressed ? `${color}1A` : 'transparent',
        color: disabled ? C.gray500 : color,
        fontSize: 16, fontWeight: 600, fontFamily: FONT,
        cursor: disabled ? 'default' : 'pointer', letterSpacing: 0.3,
        boxShadow: !disabled && pressed ? `inset 0 2px 6px ${color}26` : 'none',
        transition: 'background 120ms ease, box-shadow 120ms ease, border-color 120ms ease, color 120ms ease',
        ...style
      }}>{children}</button>);

}

function TextBtn({ children, onClick, color = C.primary, style }) {
  const [pressed, setPressed] = React.useState(false);
  const release = () => setPressed(false);
  const press = () => setPressed(true);
  return (
    <button
      onClick={onClick}
      onMouseDown={press}
      onMouseUp={release}
      onMouseLeave={release}
      onTouchStart={press}
      onTouchEnd={release}
      onTouchCancel={release}
      style={{
        width: '100%', height: 48, borderRadius: 12, border: 'none',
        background: pressed ? `${color}14` : 'transparent',
        color, fontSize: 16, fontWeight: 600,
        fontFamily: FONT, cursor: 'pointer',
        transition: 'background 120ms ease',
        ...style
      }}>{children}</button>);

}

function AppBar({ left, title, right, onLeft, bg }) {
  const gradient = !!title;
  const bgValue = bg || (gradient ? C.primary : C.bg);
  const fg = gradient ? '#fff' : C.textPri;
  const tintIcon = (el) =>
  gradient && React.isValidElement(el) ?
  React.cloneElement(el, { color: '#fff' }) :
  el;
  return (
    <div style={{
      height: 56, display: 'flex', alignItems: 'center', padding: '0 8px',
      background: bgValue, position: 'relative', flexShrink: 0
    }}>
      <div onClick={onLeft} style={{
        width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: onLeft ? 'pointer' : 'default', borderRadius: 20
      }}>{tintIcon(left)}</div>
      <div style={{
        position: 'absolute', left: 0, right: 0, textAlign: 'center',
        fontSize: 17, fontWeight: 600, color: fg, fontFamily: FONT,
        pointerEvents: 'none'
      }}><span style={{ pointerEvents: 'auto' }}>{title}</span></div>
      <div style={{ flex: 1 }} />
      <div style={{
        width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center'
      }}>{tintIcon(right)}</div>
    </div>);

}

function AppBarTabs({ tabs, value, onChange }) {
  return (
    <div style={{ display: 'flex', background: C.primary, flexShrink: 0 }}>
      {tabs.map((t) => {
        const on = t.id === value;
        return (
          <div key={t.id} onClick={() => onChange && onChange(t.id)} style={{
            flex: 1, minWidth: 0, height: 44, cursor: 'pointer', position: 'relative',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: on ? '#fff' : 'rgba(255,255,255,0.68)',
            fontFamily: FONT, fontSize: 13.5, fontWeight: 600,
            letterSpacing: -0.1, whiteSpace: 'nowrap',
            transition: 'color 140ms ease'
          }}>
            {t.label}
            {on &&
            <div style={{
              position: 'absolute', left: '22%', right: '22%', bottom: 0,
              height: 3, borderRadius: '2px 2px 0 0', background: '#fff'
            }} />
            }
          </div>);

      })}
    </div>);

}

function StatusBar() {
  return (
    <div style={{
      height: 36, padding: '0 18px 0 22px', display: 'flex',
      alignItems: 'center', justifyContent: 'space-between',
      fontFamily: FONT, fontSize: 14, fontWeight: 600,
      color: C.textPri, background: C.bg, flexShrink: 0
    }}>
      <span>9:41</span>
      <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
        <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 11L0 3.5C4.5 -0.6 11.5 -0.6 16 3.5L8 11z" fill="#212121" /></svg>
        <svg width="16" height="11" viewBox="0 0 16 11"><path d="M1 6h2v4H1zM5 4h2v6H5zM9 2h2v8H9zM13 0h2v10h-2z" fill="#212121" /></svg>
        <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="20" height="10" rx="2" fill="none" stroke="#212121" /><rect x="2" y="2" width="15" height="7" rx="1" fill="#212121" /><rect x="21" y="3" width="2" height="5" rx="1" fill="#212121" /></svg>
      </div>
    </div>);

}

function Phone({ children, w = 380, h = 820 }) {
  return (
    <div style={{
      width: w, height: h, borderRadius: 44, padding: 10,
      background: '#1a1a1a', boxShadow: '0 30px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.05)',
      position: 'relative', flexShrink: 0
    }}>
      <div data-phone-screen="true" style={{
        width: '100%', height: '100%', borderRadius: 34, overflow: 'hidden',
        background: C.bg, position: 'relative', display: 'flex', flexDirection: 'column'
      }}>
        {children}
      </div>
    </div>);

}

function Logo({ size = 96 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 96 96">
      <path d="M48 6 L82 18 V44 C82 64 68 80 48 90 C28 80 14 64 14 44 V18 Z"
      fill="#EF8B34" />
      <path d="M36 32 H50 C58 32 64 39 64 48 C64 57 58 64 50 64 H36 Z"
      fill="#fff" />
      <circle cx="50" cy="48" r="5" fill="#EF8B34" />
    </svg>);

}

function PlaceholderIllo({ w = 200, h = 200, label = "illustration", bg = C.primaryPale }) {
  const id = 'stripes-' + label.replace(/\s/g, '');
  return (
    <div style={{
      width: w, height: h, borderRadius: 16, background: bg,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      position: 'relative', overflow: 'hidden',
      border: `1px dashed ${C.primaryLight}`
    }}>
      <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0, opacity: 0.35 }}>
        <defs>
          <pattern id={id} width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="14" stroke={C.primaryLight} strokeWidth="1" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill={`url(#${id})`} />
      </svg>
      <span style={{
        fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 11,
        color: C.primary, letterSpacing: 0.5, position: 'relative',
        background: 'rgba(255,255,255,0.85)', padding: '4px 10px', borderRadius: 6
      }}>{label}</span>
    </div>);

}

function SectionLabel({ children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 4px 8px' }}>
      <div style={{ width: 4, height: 16, borderRadius: 2, background: '#F5BB87' }} />
      <div style={{
        fontSize: 13, fontWeight: 700, color: C.textPri,
        fontFamily: FONT, letterSpacing: -0.1
      }}>
        {children}
      </div>
    </div>);

}

function TextField({ value, onChange, placeholder, error, readOnly, disabled, style, type = 'text' }) {
  const [focused, setFocused] = React.useState(false);
  const borderColor = error ? C.error : disabled ? C.divider : focused ? C.primary : C.divider;
  return (
    <div style={{ ...style }}>
      <input
        type={type}
        value={value}
        placeholder={placeholder}
        readOnly={readOnly || disabled}
        onChange={(e) => onChange && onChange(e.target.value)}
        onFocus={() => setFocused(true)}
        onBlur={() => setFocused(false)}
        spellCheck={false}
        autoComplete="off"
        style={{
          width: '100%', height: 48, boxSizing: 'border-box',
          padding: '0 14px', borderRadius: 12,
          border: `1px solid ${borderColor}`,
          background: disabled ? C.gray100 : '#fff',
          color: disabled ? C.textSec : C.textPri,
          fontSize: 14, fontFamily: FONT,
          outline: 'none', cursor: disabled ? 'default' : 'text',
          transition: 'border-color 120ms ease, background 120ms ease, color 120ms ease'
        }} />
      {error &&
      <div style={{
        marginTop: 6, fontSize: 12, color: C.error,
        fontFamily: FONT, lineHeight: 1.4
      }}>
          {error}
        </div>
      }
    </div>);

}

Object.assign(window, { C, FONT, PrimaryBtn, OutlineBtn, TextBtn, AppBar, AppBarTabs, StatusBar, Phone, Logo, PlaceholderIllo, SectionLabel, TextField });

const { useState, useEffect, useRef } = React;

function ScrSplash({ go, unlockPin, payload }) {
  const failed = !!payload?.error;
  const [setup, setSetup] = useState(!unlockPin && !failed);
  useEffect(() => {
    if (failed || setup) return;
    const t = setTimeout(() => go(unlockPin ? 'unlockAuth' : 'onboarding'), 1500);
    return () => clearTimeout(t);
  }, [unlockPin, failed, setup]);
  return (
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', background: C.surface
    }}>
      <Logo size={120} />
      <div style={{ marginTop: 20, height: 48 }}>
        {!failed && !setup && <Spinner size={48} color={C.primary} />}
      </div>
      {setup &&
      <ServerSetupDialog
        onDefault={() => setSetup(false)}
        onSettings={() => go('serverUrl')} />
      }
      {failed &&
      <ServerErrorDialog go={go} onOk={() => go('splash')} />
      }
    </div>);

}

function ServerSetupDialog({ onDefault, onSettings }) {
  return (
    <CenterDialog onDismiss={onDefault}>
      <div style={{ fontSize: 18, fontWeight: 700, color: C.textPri, fontFamily: FONT }}>
        Server settings
      </div>

function Spinner({ size = 32, color = C.primary, trackColor = '#E0E0E0', frozen = false, activeIndex = 0 }) {
  const dotSize = Math.max(4, Math.round(size * 0.18));
  const dots = Array.from({ length: 8 });
  const dotInner = {
    position: 'absolute',
    top: 0, left: '50%',
    marginLeft: -dotSize / 2,
    width: dotSize, height: dotSize,
    borderRadius: '50%'
  };
  if (frozen) {
    return (
      <div data-component="Spinner" data-mode="frozen" data-size={`${size}px`}
        style={{ width: size, height: size, position: 'relative', display: 'inline-block' }}>
        {dots.map((_, i) => {
          const isActive = i === activeIndex;
          const dotColor = isActive ? color : trackColor;
          return (
            <div key={i}
              data-dot-index={i}
              data-role={isActive ? 'active' : 'track'}
              data-angle={`${i * 45}deg`}
              style={{ position: 'absolute', inset: 0, transform: `rotate(${i * 45}deg)`, pointerEvents: 'none' }}>
              <div
                data-dot-shape="circle"
                data-dot-size={`${dotSize}px`}
                data-dot-color={dotColor}
                style={{ ...dotInner, background: dotColor, pointerEvents: 'auto' }} />
            </div>);
        })}
      </div>);
  }
  return (
    <div style={{ width: size, height: size, position: 'relative', display: 'inline-block' }}>
      {dots.map((_, i) =>
      <div key={i} style={{ position: 'absolute', inset: 0, transform: `rotate(${i * 45}deg)` }}>
          <div style={{ ...dotInner, background: trackColor }} />
        </div>
      )}
      <div style={{ position: 'absolute', inset: 0, animation: 'spin 1s steps(8) infinite' }}>
        <div style={{ ...dotInner, background: color }} />
      </div>
    </div>);

}

const DEMO_PIN = '123456';
let signPin = null;

function ScrPin({ go, mode, payload }) {
  const [showSuccess, setShowSuccess] = useState(false);
  const cfg = {
    register: {
      title: 'Set PIN',
      steps: ['Type your PIN', 'Re-enter your PIN'],
      done: () => {
        if (payload?.viaBiometric) {
          go('biometricRegister', { onboardingNext: payload?.onboardingNext });
        } else if (payload?.onboardingNext) {
          go('onboarding-replace', { step: payload.onboardingNext });
        } else {
          go('biometricRegister');
        }
      },
      mismatch: 'PINs do not match.'
    },
    change: {
      title: 'Change PIN',
      steps: ['Type your current PIN', 'Type your new PIN', 'Re-enter the new PIN'],
      done: () => setShowSuccess(true),
      success: ['PIN changed', 'Your PIN has been changed successfully.'],
      wrong: 'Wrong PIN.',
      mismatch: 'PINs do not match.',
      samePin: 'New PIN must be different.'
    },
    auth: {
      title: 'Enter PIN',
      steps: ['Type your PIN to authenticate'],
      done: () => {
        if (payload?.onboardingNext) go('onboarding-replace', { step: payload.onboardingNext });else
        if (payload?.onboardingDone) go('docsEmpty');else
        if (payload?.afterAuth) go(payload.afterAuth);else
        go('back');
      },
      mismatch: 'Wrong PIN.'
    },
    unlockRegister: {
      title: 'Set Unlock PIN',
      steps: ['Type your Unlock PIN', 'Re-enter your Unlock PIN'],
      done: () => {
        go('unlockSet', { onboardingNext: payload?.onboardingNext });
      },
      mismatch: 'PINs do not match.'
    },
    unlockAuth: {
      title: 'Enter Unlock PIN',
      steps: ['Type your Unlock PIN to unlock'],
      done: () => {
        go('unlockDone');
      },
      mismatch: 'Wrong unlock PIN.'
    },
    unlockChange: {
      title: 'Change Unlock PIN',
      steps: ['Type your current Unlock PIN', 'Type your new Unlock PIN', 'Re-enter the new Unlock PIN'],
      done: () => setShowSuccess(true),
      success: ['Unlock PIN changed', 'Your Unlock PIN has been changed successfully.'],
      mismatch: 'PINs do not match.',
      samePin: 'New Unlock PIN must be different.'
    }
  }[mode];

  const [step, setStep] = useState(0);
  const [pin, setPin] = useState('');
  const [first, setFirst] = useState('');
  const [errMsg, setErrMsg] = useState('');
  const error = !!errMsg;

  const advance = (val) => {
    if (mode === 'register' || mode === 'unlockRegister') {
      if (step === 0) {setFirst(val);setPin('');setStep(1);} else
      {
        if (val !== first) {setErrMsg(cfg.mismatch);return;}
        if (mode === 'register') signPin = val;
        cfg.done();
      }
    } else if (mode === 'change' || mode === 'unlockChange') {
      const current = mode === 'change' && signPin;
      if (step === 0) {
        if (current && val !== current) {setErrMsg(cfg.wrong);return;}
        setPin('');setStep(1);
      } else
      if (step === 1) {
        if (val === (current || DEMO_PIN)) {setErrMsg(cfg.samePin);return;}
        setFirst(val);setPin('');setStep(2);
      } else
      {
        if (val !== first) {setErrMsg(cfg.mismatch);return;}
        if (current) signPin = val;
        cfg.done();
      }
    } else {
      if (mode !== 'auth' || !signPin || val === signPin) cfg.done();else
      setErrMsg(cfg.mismatch);
    }
  };

  useEffect(() => {
    if (!errMsg) return;
    const t = setTimeout(() => {setErrMsg('');setPin('');}, 1000);
    return () => clearTimeout(t);
  }, [errMsg]);

  const onKey = (k) => {
    if (errMsg) return;
    if (k === 'del') {setPin((p) => p.slice(0, -1));return;}
    if (pin.length < 6) {
      const next = pin + k;
      setPin(next);
      if (next.length === 6) {
        setTimeout(() => advance(next), 180);
      }
    }
  };

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: C.surface }}>
      <AppBar
        onLeft={() => go(mode === 'unlockAuth' ? 'splash' : 'back')}
        left={<IcClose size={24} color={C.textPri} />}
      />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: '8px 24px 16px' }}>
        <div style={{ fontSize: 24, fontWeight: 700, color: C.textPri, fontFamily: FONT }}>
          {cfg.title}
        </div>
        <div style={{ fontSize: 14, color: C.textSec, fontFamily: FONT, marginTop: 6 }}>
          {cfg.steps[step]}
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 12 }}>
          <PinDots value={pin} error={error} />
          {error &&
          <div style={{ textAlign: 'center', color: C.error, fontSize: 13, fontFamily: FONT, fontWeight: 500 }}>
              {errMsg}
            </div>
          }
        </div>
      </div>
      <NumPad onKey={onKey} />
      {showSuccess &&
      <CenterDialog onDismiss={() => {setShowSuccess(false);go('back');}}>
          <div style={{ fontSize: 18, fontWeight: 700, color: C.textPri, fontFamily: FONT }}>
            {cfg.success[0]}
          </div>
          <div style={{ fontSize: 14, color: C.textSec, fontFamily: FONT, lineHeight: 1.5 }}>
            {cfg.success[1]}
          </div>
          <PrimaryBtn onClick={() => {setShowSuccess(false);go('back');}}>OK</PrimaryBtn>
        </CenterDialog>
      }
    </div>);

}

              <span style={{ color: C.textSec }}>Format</span><span>{cred.vciFormat}</span>
            </div>

          {cred.form.map((f) =>

              <div style={label}>{f.l}{f.req && req}</div>

function BottomSheet({ items, onClose, title, description, select }) {

    <div onClick={() => dismiss(onClose)} style={{

function FakeQR({ size = 240 }) {
  const cells = [];
  for (let r = 0; r < 25; r++) {
    for (let c = 0; c < 25; c++) {
      const v = Math.sin(r * 7.3 + c * 3.1) + Math.cos(r * 1.7 + c * 5.9);
      if (v > 0.2) cells.push([r, c]);
    }
  }
  const finder = (x, y) =>
  <g key={`${x}-${y}`}>
      <rect x={x} y={y} width="7" height="7" fill="#212121" />
      <rect x={x + 1} y={y + 1} width="5" height="5" fill="#fff" />
      <rect x={x + 2} y={y + 2} width="3" height="3" fill="#212121" />
    </g>;

  return (
    <div style={{
      padding: 16, background: '#fff', borderRadius: 16,
      boxShadow: '0 4px 24px rgba(0,0,0,0.08)', border: `1px solid ${C.divider}`
    }}>
      <svg width={size} height={size} viewBox="0 0 25 25">
        {cells.map(([r, c], i) => {
          const isFinderArea = r < 8 && c < 8 || r < 8 && c > 16 || r > 16 && c < 8;
          if (isFinderArea) return null;
          return <rect key={i} x={c} y={r} width="1" height="1" fill="#212121" />;
        })}
        {finder(0, 0)}{finder(18, 0)}{finder(0, 18)}
      </svg>
    </div>);

}

const { useState: uS4, useEffect: uE4 } = React;

const withReq = (claims, reqOf) =>
claims.map((c) => {
  const key = c.group || c.l;
  const req = reqOf === 'all' || Array.isArray(reqOf) && reqOf.indexOf(key) >= 0;
  return req ? { ...c, req: true } : c;
});

const vpClaimsOf = (id) => CREDENTIALS.find((c) => c.id === id).claims.map(([l, v, img]) => img ? { l, img } : { l, v });

const VP_CANDIDATES = [
{ id: 'o0', credId: 'mdocpid', doc: 'mDocPID', claims: vpClaimsOf('mdocpid'), mixedReq: ['given_name', 'family_name', 'birth_date'] },
{ id: 'o1', credId: 'bpvc', doc: 'Basic Person VC', claims: vpClaimsOf('bpvc'), mixedReq: ['Full Name', 'Birth Date'] },
{ id: 'o2', credId: 'dlvc', doc: 'Driver License VC', claims: vpClaimsOf('dlvc'), mixedReq: ['License Number'] },
{ id: 'o3', credId: 'vidsd', doc: 'VerifiableIdSD', claims: vpClaimsOf('vidsd'), mixedReq: ['given_name', 'family_name', 'birthdate'] },
{ id: 'o4', credId: 'bpvczkp', doc: 'Basic Person VC (ZKP)', claims: vpClaimsOf('bpvc'), mixedReq: ['Full Name', 'Birth Date'] }];


const vpBuildOptions = (composition, multi, ids, pick, held) => {
  const active = VP_CANDIDATES.filter((o) => {
    const cred = CREDENTIALS.find((c) => c.id === o.credId);
    return cred ? cred.status === 'Active' : true;
  });
  const pool = ids ? active.filter((o) => ids.includes(o.id)) :
  multi ? active :
  active.filter((o) => o.id === 'o1');
  const reqOf = composition === 'required' ? 'all' : composition === 'optional' ? [] : null;
  return pool.flatMap((o) => {
    const want = pick && pick[o.id];
    const own = held ? held.filter((c) => c.id === o.credId) : [];
    return (own.length ? own : [null]).map((inst) => {
      const base = inst ? inst.claims.map(([l, v, img]) => img ? { l, img } : { l, v }) : o.claims;
      return {
        id: own.length > 1 ? o.id + ':' + inst.uid : o.id,
        doc: own.length > 1 ? `${o.doc} (issued ${inst.issuedAt})` : o.doc,
        claims: withReq(base, want ? want : reqOf === null ? o.mixedReq : reqOf)
      };
    });
  }).map((opt, i, arr) => ({ ...opt, title: `Option ${i + 1} of ${arr.length}` }));
};

const vpIsReq = (c) => c.req === true;
const vpClaimKey = (optId, c) => optId + ':' + (c.group || c.l);

function ScrVpRequest({ go, mode = 'sd', payload, composition = 'mixed', multi = false, credentials }) {
  const options = React.useMemo(
  () => vpBuildOptions(composition, multi, payload?.candidateIds, payload?.requestedClaims, credentials),
  [composition, multi, payload?.candidateIds, payload?.requestedClaims, credentials]);
  const initialId = options[0]?.id;
  const many = multi || options.length > 1;

  const [selected, setSelected] = uS4(initialId);
  const [checks, setChecks] = uS4({});
  const [showSuccess, setShowSuccess] = uS4(false);
  const [expanded, setExpanded] = uS4(() =>
  options.reduce((acc, o) => {acc[o.id] = !many;return acc;}, {})
  );
  const [groupOpen, setGroupOpen] = uS4(() => {
    const g = {};
    options.forEach((o) => o.claims.forEach((c) => {if (c.group) g[vpClaimKey(o.id, c)] = true;}));
    return g;
  });

  uE4(() => {
    if (payload?.successAt) setShowSuccess(true);
  }, [payload?.successAt]);

  const isChecked = (k) => checks[k] === true;

  const selectOption = (id) => {
    if (id === selected) return;
    setSelected(id);
    setChecks({});
    setExpanded(options.reduce((acc, o) => {acc[o.id] = o.id === id;return acc;}, {}));
  };

  const toggleClaim = (k) => setChecks((c) => ({ ...c, [k]: !isChecked(k) }));

  const toggleGroup = (base, items) => {
    const on = isChecked(base);
    setChecks((c) => {
      const next = { ...c, [base]: !on };
      items.forEach((s) => {next[base + ':' + s.l] = !on;});
      return next;
    });
  };

  const toggleSelectAll = (opt, optionalClaims) => {
    const allOn = optionalClaims.every((c) => isChecked(vpClaimKey(opt.id, c)));
    setChecks((c) => {
      const next = { ...c };
      optionalClaims.forEach((cl) => {
        const k = vpClaimKey(opt.id, cl);
        next[k] = !allOn;
        if (cl.group) cl.items.forEach((s) => {next[k + ':' + s.l] = !allOn;});
      });
      return next;
    });
  };

  const current = options.find((o) => o.id === selected) || options[0];
  const curRequired = current ? current.claims.filter(vpIsReq) : [];
  const curOptional = current ? current.claims.filter((c) => !vpIsReq(c)) : [];
  const curOptionalOn = current ?
  curOptional.filter((c) => isChecked(vpClaimKey(current.id, c))).length :
  0;
  const canSubmit = curRequired.length > 0 || curOptionalOn > 0;

  const sectionCardStyle = {
    background: '#fff', borderRadius: 16,
    boxShadow: '0 1px 2px rgba(0,0,0,0.04)'
  };
  const sectionTitle = (title) =>
  <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 4px 8px' }}>
      <div style={{ width: 4, height: 16, borderRadius: 2, background: '#F5BB87' }} />
      <div style={{
      fontSize: 13, fontWeight: 700, color: C.textPri,
      fontFamily: FONT, letterSpacing: -0.1
    }}>
        {title}
      </div>
    </div>;


  const renderClaim = (opt, c, isLast, showControl) => {
    const base = vpClaimKey(opt.id, c);
    if (c.group) {
      const gOpen = !!groupOpen[base];
      const gChecked = isChecked(base);
      return (
        <div key={base} style={{ borderBottom: isLast ? 'none' : `1px solid ${C.divider}` }}>
          <div onClick={() => setGroupOpen((g) => ({ ...g, [base]: !gOpen }))} style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '12px 0', cursor: 'pointer'
          }}>
            {gOpen ?
            <IcChevU size={18} color={C.primary} /> :
            <IcChevD size={18} color={C.primary} />}
            <div style={{ flex: 1, fontSize: 13, fontWeight: 700, color: C.textPri, fontFamily: FONT }}>
              {c.group}
            </div>
            {showControl && mode === 'sd' &&
            <div onClick={(e) => {e.stopPropagation();toggleGroup(base, c.items);}} style={{ cursor: 'pointer' }}>
                <div style={{
                width: 22, height: 22, borderRadius: 6,
                border: `1.5px solid ${gChecked ? C.primary : C.gray300}`,
                background: gChecked ? C.primary : '#fff',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                transition: 'all 150ms'
              }}>
                  {gChecked && <IcCheck size={14} color="#fff" stroke={3} />}
                </div>
              </div>
            }
          </div>
          {gOpen &&
          <div style={{ paddingBottom: 6, paddingLeft: 12 }}>
              {c.items.map((sub, j) =>
            <VpClaimItem key={sub.l} label={sub.l} value={sub.v}
              checked mode={mode} isLast={j === c.items.length - 1} hideControl />
            )}
            </div>
          }
        </div>);

    }
    return (
      <VpClaimItem key={base} label={c.l} value={c.v} image={c.img}
        checked={isChecked(base)}
        onToggle={() => toggleClaim(base)}
        mode={mode} isLast={isLast} hideControl={!showControl} />);

  };

  const renderClaims = (opt, selectable) => {
    const required = opt.claims.filter(vpIsReq);
    const optional = opt.claims.filter((c) => !vpIsReq(c));
    const allOn = optional.length > 0 && optional.every((c) => isChecked(vpClaimKey(opt.id, c)));
    return (
      <div style={{ paddingLeft: 12 }}>
        {required.length > 0 &&
        <div>
            <VpClaimGroupHead label="Required" isFirst />
            {required.map((c, i) => renderClaim(opt, c, i === required.length - 1, false))}
          </div>
        }
        {optional.length > 0 &&
        <div style={{ marginTop: required.length > 0 ? 4 : 0 }}>
            <VpClaimGroupHead label="Optional" isFirst={required.length === 0}
            rightSlot={selectable ?
            <VpSelectAll allOn={allOn} onClick={() => toggleSelectAll(opt, optional)} /> :
            null} />
            {optional.map((c, i) => renderClaim(opt, c, i === optional.length - 1, selectable))}
          </div>
        }
      </div>);

  };

  const docHeader = (opt, open) =>
  <div onClick={() => setExpanded((e) => ({ ...e, [opt.id]: !open }))} style={{
    display: 'flex', alignItems: 'center', gap: 8,
    padding: '12px 0', cursor: 'pointer'
  }}>
      {open ?
    <IcChevU size={20} color={C.primary} /> :
    <IcChevD size={20} color={C.primary} />}
      <div style={{ flex: 1, fontSize: 15, fontWeight: 700, color: C.textPri, fontFamily: FONT }}>
        {opt.doc}
      </div>
    </div>;


  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: C.surface, minHeight: 0 }}>
      <AppBar onLeft={() => go('docs')} left={<IcBack size={24} color={C.textPri} />} title="Presentation" />
      <div style={{ flex: 1, overflow: 'auto', padding: '20px 16px 24px', minHeight: 0, display: 'flex', flexDirection: 'column', gap: 20 }}>

        <div>
          {sectionTitle('Requesting Institution')}
          <div style={{
            background: '#fff', borderRadius: 14, padding: 16,
            border: '1px solid #ECECEC', boxShadow: '0 1px 3px rgba(230,81,0,0.06)'
          }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: C.textPri, fontFamily: FONT, lineHeight: 1.3 }}>
              {payload?.verifier || 'OpenDID Verifier'}
            </div>
          </div>
        </div>

        <div>
          {sectionTitle('Submission Details')}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {options.map((opt) => {
              const open = !!expanded[opt.id];
              const sel = opt.id === selected;

              if (!many) {
                return (
                  <div key={opt.id} style={{ ...sectionCardStyle, padding: open ? '4px 16px 12px' : '4px 16px' }}>
                    {docHeader(opt, open)}
                    {open && renderClaims(opt, true)}
                  </div>);

              }

              return (
                <div key={opt.id} style={{
                  background: '#fff', borderRadius: 16, overflow: 'hidden',
                  border: sel ? `2px solid ${C.primary}` : '1px solid #ECECEC',
                  boxShadow: '0 1px 2px rgba(0,0,0,0.04)',
                  transition: 'border-color 150ms'
                }}>
                  <div onClick={() => selectOption(opt.id)} style={{
                    display: 'flex', alignItems: 'center', gap: 12,
                    padding: '14px 16px', cursor: 'pointer', userSelect: 'none',
                    background: sel ? C.primaryPale : '#fff', transition: 'background 150ms'
                  }}>
                    <VpOptionRadio on={sel} />
                    <div style={{ flex: 1, fontSize: 15, fontWeight: 700, color: C.textPri, fontFamily: FONT }}>
                      {opt.title}
                    </div>
                  </div>
                  <div style={{ borderTop: `1px solid ${C.divider}`, padding: '0 16px 8px' }}>
                    {docHeader(opt, open)}
                    {open && renderClaims(opt, sel)}
                  </div>
                </div>);

            })}
          </div>
        </div>
      </div>

      <div style={{ padding: '12px 16px 16px', borderTop: `1px solid ${C.divider}`, flexShrink: 0, background: C.surface, display: 'flex', gap: 10 }}>
        <OutlineBtn onClick={() => go('docs')}>Reject</OutlineBtn>
        <PrimaryBtn disabled={!canSubmit} onClick={() => go('pinAuth', {
          afterAuth: 'vpRequestSuccess',
          vp: { id: current.id.split(':')[0], claims: current.claims.filter((c) => vpIsReq(c) || isChecked(vpClaimKey(current.id, c))).map((c) => [c.l, c.v, c.img]) }
        })}>Accept</PrimaryBtn>
      </div>

      {showSuccess &&
      <CenterDialog onDismiss={() => {setShowSuccess(false);go('docsPopulated');}}>
          <div style={{ fontSize: 18, fontWeight: 700, color: C.textPri, fontFamily: FONT }}>
            Submission successful
          </div>
          <div style={{ fontSize: 14, color: C.textSec, fontFamily: FONT, lineHeight: 1.5 }}>
            Your information has been shared successfully.
          </div>
          <PrimaryBtn onClick={() => {setShowSuccess(false);go('docsPopulated');}}>Done</PrimaryBtn>
        </CenterDialog>
      }
    </div>);

}

const SERVER_URL_DEFAULT = {
  base: 'http://localhost',
  endpoints: [
  { key: 'TAS_URL', label: 'TAS', port: 8090 },
  { key: 'CAS_URL', label: 'CAS', port: 8094 },
  { key: 'API_GW_URL', label: 'API Gateway', port: 8093 },
  { key: 'WALLET_URL', label: 'Wallet', port: 8095 },
  { key: 'VERIFIER_URL', label: 'Verifier', port: 8092 },
  { key: 'DEMO_URL', label: 'Demo', port: 8099 }]

};

const serverUrlDefaults = () =>
SERVER_URL_DEFAULT.endpoints.reduce((acc, e) => {
  acc[e.key] = `${SERVER_URL_DEFAULT.base}:${e.port}`;
  return acc;
}, {});

const SERVER_URL_RE = /^(https?):\/\/([^\s\/:]+)(?::(\d+))?(\/\S*)?$/;

const validateServerUrl = (v) => {
  const t = (v || '').trim();
  if (!t) return 'Enter a URL.';
  const m = t.match(SERVER_URL_RE);
  if (!m) return 'Enter a valid URL starting with http:// or https://.';
  if (m[3] !== undefined) {
    const n = Number(m[3]);
    if (n < 1 || n > 65535) return 'Port must be between 1 and 65535.';
  }
  return null;
};

const sameCustom = (a, b) => {
  const ka = Object.keys(a);
  return ka.length === Object.keys(b).length && ka.every((k) => a[k] === b[k]);
};

function ServerUrlRowBtn({ children, onClick, muted, disabled }) {
  const color = disabled ? C.gray500 : muted ? C.textSec : C.primary;
  return (

      border: `1px solid ${disabled || muted ? C.gray300 : C.primary}`,

}

function ScrServerUrl({ go, preview, payload }) {
  const defaults = serverUrlDefaults();
  const noBack = !!payload?.fromSplash || preview === 'fromSplash';
  const saved = {};
  const readOnly = !!preview;

  const seedCustom = () => {
    if (preview === 'edited') return { API_GW_URL: 'http://localhost:8093' };
    if (preview === 'invalid') return { CAS_URL: 'htp://localhost:8094' };
    return {};
  };
  const seedErrors = () =>
  preview === 'invalid' ?
  { CAS_URL: 'Enter a valid URL starting with http:// or https://.' } :
  {};

  const [custom, setCustom] = uS4(seedCustom);
  const [errors, setErrors] = uS4(seedErrors);

  const customList = SERVER_URL_DEFAULT.endpoints.filter((e) => custom[e.key] !== undefined);
  const defaultList = SERVER_URL_DEFAULT.endpoints.filter((e) => custom[e.key] === undefined);

  const dirty = !sameCustom(custom, saved);
  const hasError = customList.some((e) => !!errors[e.key]);

  const toCustom = (key) => {
    setCustom((c) => ({ ...c, [key]: defaults[key] }));
    setErrors((er) => ({ ...er, [key]: null }));
  };

  const toDefault = (key) => {
    setCustom((c) => {const n = { ...c };delete n[key];return n;});
    setErrors((er) => ({ ...er, [key]: null }));
  };

  const allToCustom = () => {
    setCustom((c) => ({ ...defaults, ...c }));
    setErrors({});
  };
  const allToDefault = () => {
    setCustom({});
    setErrors({});
  };

  const setUrl = (key, v) => {
    setCustom((c) => ({ ...c, [key]: v }));
    setErrors((er) => ({ ...er, [key]: validateServerUrl(v) }));
  };

  const onBack = () => go('back');

  const card = {
    background: '#fff', border: `1px solid ${C.divider}`, borderRadius: 14, padding: '4px 14px'
  };
  const emptyNote = {
    padding: '14px 0', fontSize: 13, color: C.textSec, fontFamily: FONT, lineHeight: 1.45, textAlign: 'left'
  };
  const rowLabel = { fontSize: 13, fontWeight: 600, color: C.textPri, fontFamily: FONT };

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: C.surface, position: 'relative', minHeight: 0 }}>
      <AppBar
        onLeft={noBack ? undefined : onBack}
        left={noBack ? null : <IcBack size={24} color={C.textPri} />}
        title="Server URL" />

      <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div>
          <ServerUrlSectionHead action={
          <ServerUrlRowBtn muted disabled={customList.length === 0} onClick={readOnly ? undefined : allToDefault}>All Default</ServerUrlRowBtn>
          }>Custom</ServerUrlSectionHead>
          <div style={card}>
            {customList.length === 0 &&
            <div style={emptyNote}>No custom endpoints.<br />Tap Custom on an endpoint below to edit it.</div>
            }
            {customList.map((e, i) =>
            <div key={e.key} style={{
              padding: '12px 0',
              borderBottom: i < customList.length - 1 ? `1px solid ${C.divider}` : 'none'
            }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', paddingBottom: 8 }}>
                  <div style={rowLabel}>{e.label}</div>
                  <ServerUrlRowBtn muted onClick={readOnly ? undefined : () => toDefault(e.key)}>Default</ServerUrlRowBtn>
                </div>
                <TextField
                value={custom[e.key]}
                error={errors[e.key]}
                readOnly={readOnly}
                onChange={(v) => setUrl(e.key, v)} />
              </div>
            )}
          </div>
        </div>

        <div>
          <ServerUrlSectionHead action={
          <ServerUrlRowBtn disabled={defaultList.length === 0} onClick={readOnly ? undefined : allToCustom}>All Custom</ServerUrlRowBtn>
          }>Default</ServerUrlSectionHead>
          <div style={card}>
            {defaultList.length === 0 &&
            <div style={emptyNote}>All endpoints are set to custom.</div>
            }
            {defaultList.map((e, i) =>
            <div key={e.key} style={{
              display: 'flex', alignItems: 'center', gap: 12, padding: '12px 0',
              borderBottom: i < defaultList.length - 1 ? `1px solid ${C.divider}` : 'none'
            }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={rowLabel}>{e.label}</div>
                  <div style={{
                  marginTop: 4, fontSize: 13, color: C.textSec, fontFamily: FONT,
                  lineHeight: 1.4, wordBreak: 'break-all'
                }}>
                    {defaults[e.key]}
                  </div>
                </div>
                <ServerUrlRowBtn onClick={readOnly ? undefined : () => toCustom(e.key)}>Custom</ServerUrlRowBtn>
              </div>
            )}
          </div>
        </div>
      </div>

      <div style={{
        display: 'flex', gap: 10, padding: 16,
        background: '#fff', borderTop: `1px solid ${C.divider}`
      }}>
        <div style={{ flex: 1 }}>
          <OutlineBtn onClick={onBack}>Cancel</OutlineBtn>
        </div>
        <div style={{ flex: 1 }}>
          <PrimaryBtn disabled={!dirty || hasError} onClick={() => go('back')}>
            Save
          </PrimaryBtn>
        </div>
      </div>
    </div>);

}

function App() {
  const [stack, setStack] = useState([{ name: 'splash' }]);
  const [credentials, setCreds] = useState([]);
  const [unlockPin, setUnlockPin] = useState(null);
  const [userName, setUserName] = useState('');
  const [bleMode, setBleMode] = useState(BLE_MODE_DEFAULT);
  const [sheet, setSheet] = useState(null);
  const [picker, setPicker] = useState(false);
  const [pickedCred, setPickedCred] = useState(null);

  const current = stack[stack.length - 1];
  const go = (name, payload) => {
    if (name === 'pickIssue') {
      setPicker('issue');
      return;
    }
    if (name === 'pickCredential') {
      if (credentials.some((c) => c.status === 'Active')) setPicker('present');else
      window.alert('No credentials to present. Add a credential first.');
      return;
    }
    if (name === 'proximity' && !credentials.some((c) => c.id === 'mdocpid')) {
      window.alert('mDocPID required. Proximity presentation requires an mDocPID credential. Add it from + > From list > OID4VCI.');
      return;
    }
    if (name === 'back') {
      setStack((s) => s.length > 1 ? s.slice(0, -1) : s);
      return;
    }
    if (name === 'onboarding-replace') {
      setStack([{ name: 'onboarding', payload }]);
      return;
    }
    if (name === 'docs' || name === 'docsEmpty') {
      const target = credentials.length > 0 ? 'docs' : 'docsEmpty';
      setStack([{ name: target }]);
      return;
    }
    if (name === 'docsPopulated') {
      if (credentials.length === 0) {
        setCreds(CREDENTIALS.filter((c) => c.id === 'bpvc').map((c) => ({ ...c, uid: 'bpvc-0', issuedAt: '00:00:00' })));
      }
      setStack([{ name: 'docs' }]);
      return;
    }
    if (name === 'vpRequestSuccess' || name === 'deleteAuthed') {
      if (name === 'vpRequestSuccess' && current.name === 'pinAuth' && current.payload?.vp) {
        window.parent.postMessage({ __ix: 'wallet', ev: 'vp', data: current.payload.vp }, location.origin);
      }
      setStack((s) => {
        if (s.length < 2 || s[s.length - 1].name !== 'pinAuth') return s;
        const popped = s.slice(0, -1);
        const last = popped[popped.length - 1];
        popped[popped.length - 1] = { ...last, payload: { ...last.payload, successAt: Date.now() } };
        return popped;
      });
      return;
    }
    if (name === 'unlockSet') {
      setUnlockPin('123456');
      if (payload?.onboardingNext) {
        setStack([{ name: 'onboarding', payload: { step: payload.onboardingNext } }]);
      } else {
        setStack((s) => s.length > 1 ? s.slice(0, -1) : s);
      }
      return;
    }
    if (name === 'unlockClear') {
      setUnlockPin(null);
      return;
    }
    if (name === 'unlockDone') {
      const target = credentials.length > 0 ? 'docs' : 'docsEmpty';
      setStack([{ name: target }]);
      return;
    }
    if (name === 'splash') {
      setCreds([]);
      setUnlockPin(null);
      setUserName('');
      signPin = null;
      setPicker(false);
      setStack([{ name: 'splash' }]);
      return;
    }
    if (name === 'deleteDone') {
      const rest = credentials.filter((c) => c.uid !== payload?.uid);
      setCreds(rest);
      setStack((s) => rest.length > 0 ? s.slice(0, -1) : [{ name: 'docsEmpty' }]);
      return;
    }
    if (name === 'serverUrl') {
      window.alert(DEMO_UNAVAILABLE);
      return;
    }
    if (name === 'issueSuccess') {
      const inst = { ...payload, uid: payload.id + '-' + Date.now(), issuedAt: new Date().toTimeString().slice(0, 8) };
      payload = inst;
      setCreds((cs) => payload.badge === 'VC' && cs.some((c) => c.name === payload.name) ? cs.map((c) => c.name === payload.name ? inst : c) : [...cs, inst]);
    }
    setStack((s) => [...s, { name, payload }]);
  };

  const goRef = React.useRef(go);
  goRef.current = go;
  useEffect(() => {
    const onMsg = (e) => {
      const m = e.data;
      if (e.origin === location.origin && m && m.__ix === 'wallet' && m.cmd === 'go') goRef.current(m.name, m.payload);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const shown = sheet || current.name;
  useEffect(() => {
    window.parent.postMessage({ __ix: 'wallet', ev: 'nav', name: shown }, location.origin);
  }, [shown]);

  const renderScreen = () => {
    const c = current;
    switch (c.name) {
      case 'splash':return <ScrSplash go={go} unlockPin={unlockPin} payload={c.payload} />;
      case 'onboarding':return <ScrOnboarding go={go} payload={c.payload} />;
      case 'userInfoWebView':return <ScrUserInfoWebView go={go} payload={c.payload} onSave={setUserName} />;
      case 'pinRegister':return <ScrPin go={go} mode="register" payload={c.payload} />;
      case 'pinChange':return <ScrPin go={go} mode="change" payload={c.payload} />;
      case 'pinAuth':return <ScrPin go={go} mode="auth" payload={c.payload} />;
      case 'unlockRegister':return <ScrPin go={go} mode="unlockRegister" payload={c.payload} />;
      case 'unlockAuth':return <ScrPin go={go} mode="unlockAuth" payload={c.payload} />;
      case 'unlockChange':return <ScrPin go={go} mode="unlockChange" payload={c.payload} />;
      case 'authMethod':return <ScrAuthMethod go={go} payload={c.payload} />;
      case 'biometricRegister':return <ScrBiometric go={go} payload={c.payload} />;
      case 'docsEmpty':return <ScrDocsEmpty go={(n, p) => {if (n === 'docsAdd') setSheet('docsAdd');else go(n, p);}} />;
      case 'docs':return <ScrDocs go={(n, p) => {
          if (n === 'docsAdd') setSheet('docsAdd');else
          if (n === 'homeAuth') setSheet('homeAuth');else
          go(n, p);
        }} credentials={credentials} />;
      case 'protocolSelect':return <ScrProtocolSelect go={go} />;
      case 'docsAddList':return <ScrDocsAddList go={go} protocol={c.payload?.protocol} onPick={(c) => go('issueForm', c)} />;
      case 'issueForm':return <ScrIssueForm go={go} cred={c.payload} onSubmit={(cr) => {setPickedCred(cr);go('pinAuth', { afterAuth: 'issueProgress' });}} />;
      case 'issueProgress':return <ScrProgress go={go} cred={pickedCred} />;
      case 'issueSuccess':return <ScrIssueSuccess go={go} cred={c.payload || pickedCred} />;
      case 'qrScanIssue':return <ScrQrScan go={(n) => {
          if (n === 'back') return go('back');
          setPickedCred(c.payload);
          go('pinAuth', { afterAuth: 'issueProgress' });
        }} />;
      case 'vcDetail':return <ScrVcDetail go={go} cred={c.payload} />;
      case 'vcDetailZkp':return <ScrVcDetailZkp go={go} cred={c.payload} />;
      case 'proximity':return <ScrProximity go={go} />;
      case 'qrScan':return <ScrQrScan go={(n, p) => go(n, n === 'vpProgress' ? c.payload : p)} />;
      case 'vpProgress':return <ScrVpProgress go={go} payload={c.payload} />;
      case 'vpRequest':return <ScrVpRequest go={go} mode="sd" payload={c.payload} multi={(c.payload?.candidateIds || []).length > 1} credentials={credentials} />;
      case 'vpRequestZkp':return <ScrVpRequestZkp go={go} payload={c.payload} />;
      case 'menu':return <ScrMenu go={go} unlockPin={unlockPin} bleMode={bleMode} onBleModeChange={setBleMode} userName={userName} />;
      case 'serverUrl':return <ScrServerUrl go={go} payload={c.payload} />;
      default:return <div style={{ padding: 20 }}>Unknown: {c.name}</div>;
    }
  };

  return (
    <div className="stage">
      <Phone>
        <StatusBar />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', position: 'relative', overflow: 'hidden' }}>
          {renderScreen()}
          {sheet === 'docsAdd' && <DocsAddSheet onClose={() => setSheet(null)} go={(n, p) => {setSheet(null);go(n, p);}} />}
          {sheet === 'homeAuth' && <HomeAuthSheet onClose={() => setSheet(null)} go={(n, p) => {setSheet(null);go(n, p);}} />}
        </div>
        <div style={{
          height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: '#fff', borderTop: `1px solid ${C.divider}`
        }}>
          <div style={{ width: 120, height: 4, borderRadius: 2, background: '#1a1a1a', opacity: 0.4 }} />
        </div>
      </Phone>
      {picker === 'present' && <DemoCredentialPicker credentials={credentials.filter((c) => c.status === 'Active')}
      prompt="Choose a credential to present"
      notice="This selection is for the demo only. In the app, scanning a verifier QR code opens the request without choosing a credential."
      onCancel={() => setPicker(false)} onOk={(ids) => {setPicker(false);go('qrScan', { candidateIds: VP_CANDIDATES.filter((o) => ids.includes(o.credId)).map((o) => o.id) });}} />}
      {picker === 'issue' && <DemoCredentialPicker credentials={QR_ISSUABLE}
      prompt="Choose a credential to issue"
      notice="This selection is for the demo only. In the app, the credential is determined by the issuer QR code."
      onCancel={() => setPicker(false)} onOk={(ids) => {setPicker(false);go('qrScanIssue', QR_ISSUABLE.find((c) => c.id === ids[0]));}} />}
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
